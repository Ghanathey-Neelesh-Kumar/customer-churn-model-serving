apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customer-churn-api
  namespace: churn-serving
spec:
  parentRefs:
    - name: churn-api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: customer-churn-api
          port: 80
