apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: churn-api-gateway
  namespace: churn-serving
spec:
  # Replace with the GatewayClass installed in your environment.
  gatewayClassName: <GATEWAY_CLASS_NAME>
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
